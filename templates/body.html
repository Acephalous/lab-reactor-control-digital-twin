<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laboratory Reactor Management</title>
    <style>
        table {
            overflow: hidden;
            font-size: 13px;
            width: 100%;
            margin: 16px auto;
        }
        h1 {
            text-align: left;
            padding : 0 46px;
            font-size: 24px;
            margin-top: 16px;
            margin-bottom: 8px;
        }
        .submodule { 
            background:#ffffff; 
            box-shadow:0 2px 8px rgba(0,0,0,0.07);
            outline: 2px solid #181818; 
            padding:12px;
        }
        .submodule_button {
            background: linear-gradient(to right, #221f1f, #282e2d);
            color: #fff;
            border: none;
            border-radius: 2px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s;
        }
        .submodule_button.disabled {
            background: #bdbdbd;
            color: #888;
            cursor: not-allowed;
            border: none;
            opacity: 0.7;
        }
        .tableview {
            outline: 2px solid #161616;
            background: #fbfbfb;
            padding: 8px 16px 16px 6px;
            margin: -10px auto;
            width: 100%;
            box-sizing: border-box;
        }
        th, td {
            padding: 8px 16px;
            background-color: #ffffff;
        }
        .nav a.active, .nav-btn.active, .nav a:focus, .nav-btn:focus {
            outline: 2px solid #161616;
            outline-offset: 0px;
        }
        body { font-family: Tahoma, Arial, sans-serif; margin: 0; background: #fbfbfb; }
        .nav {
            margin-top: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 90%;
            margin-left: 16px;
            margin-right: auto;
        }
        .nav a { 
            display: inline-block; 
            margin: 10px 10px 10px 0; 
            padding: 12px 24px; 
            background: linear-gradient(to right, #4d4848, #404948);
            color: #fff; 
            text-decoration: none; 
            font-weight: bold;
            border-radius: 3px;
            transition: background 0.2s;
        }
        .nav a.active {
            background: linear-gradient(to right, #555e59, #6b7a6a);
            color: #fff;
            outline: 2px solid #555e59;
        }
        .logo-bg {
            background: #f0f8fc;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            padding: 0;
            display: flex;
            justify-content: left;
            align-items: left;
            box-sizing: border-box;
        }
        .nav-btn {
            display: inline-block;
            margin: 10px 10px 10px 0;
            padding: 12px 24px;
            background: linear-gradient(to right, #221f1f, #282e2d);
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background: linear-gradient(to right, #221f1f, #282e2d);
        }        
        .nav a:hover { background: linear-gradient(to right, #221f1f, #282e2d); }
    </style>
</head>
